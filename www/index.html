<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
<title>KMI-30 Live</title>
<meta name="theme-color" content="#12151a" />
<style>
  :root {
    --bg: #12151a;
    --card: #1a1f27;
    --card-border: #262c37;
    --text: #e7ebf1;
    --dim: #7c8697;
    --accent: #3ecf8e;
    --accent2: #6ea8fe;
    --down: #e5484d;
    --btn-bg: #232935;
    --pinned-bg: #16261f;
    --mono: ui-monospace, "SF Mono", "Cascadia Mono", Menlo, Consolas, monospace;
  }
  body.light-theme {
    --bg: #f4f6f8;
    --card: #ffffff;
    --card-border: #e1e5eb;
    --text: #1b2027;
    --dim: #6b7480;
    --accent: #1e9e63;
    --accent2: #2f6fd6;
    --down: #d1373f;
    --btn-bg: #eceff3;
    --pinned-bg: #e6f5ee;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
    -webkit-tap-highlight-color: transparent;
  }
  header {
    position: sticky; top: 0; z-index: 10;
    background: var(--bg); padding: 16px 16px 12px; border-bottom: 1px solid var(--card-border);
  }
  .header-top { display: flex; align-items: center; justify-content: space-between; }
  h1 { font-size: 19px; margin: 0; font-weight: 700; letter-spacing: 0.2px; }
  .icon-btn {
    background: var(--btn-bg); border: 1px solid var(--card-border); color: var(--text);
    border-radius: 9px; width: 34px; height: 34px; font-size: 16px; line-height: 1;
    display: flex; align-items: center; justify-content: center; cursor: pointer;
  }
  .icon-btn:active { opacity: 0.7; }
  .toolbar { display: flex; flex-wrap: wrap; gap: 8px; padding: 10px 16px; border-bottom: 1px solid var(--card-border); }
  .toolbar-select {
    flex: 1; min-width: 140px; background: var(--btn-bg); border: 1px solid var(--card-border); color: var(--text);
    border-radius: 9px; padding: 8px 10px; font-size: 13px;
  }
  .toolbar-btn {
    flex-shrink: 0; background: var(--btn-bg); border: 1px solid var(--card-border); color: var(--text);
    border-radius: 9px; padding: 8px 12px; font-size: 13px; cursor: pointer;
  }
  .toolbar-btn:active { opacity: 0.7; }
  .toolbar-icon-btn {
    flex-shrink: 0; background: var(--btn-bg); border: 1px solid var(--card-border); color: var(--text);
    border-radius: 9px; width: 34px; height: 34px; font-size: 15px; line-height: 1;
    display: flex; align-items: center; justify-content: center; cursor: pointer;
  }
  .toolbar-icon-btn:active { opacity: 0.7; }
  .toolbar-icon-btn.active { color: var(--accent); border-color: var(--accent); }
  .auto-sort-label {
    display: flex; align-items: center; gap: 5px; font-size: 12.5px; color: var(--dim);
    white-space: nowrap; flex-shrink: 0;
  }
  .auto-sort-label input { accent-color: var(--accent); width: 15px; height: 15px; }
  .pin-rank {
    flex-shrink: 0; width: 20px; height: 20px; border-radius: 50%; background: var(--accent);
    color: #0a1510; font-size: 11px; font-weight: 700; display: flex; align-items: center;
    justify-content: center; margin-right: 6px;
  }
  .pin-rank:empty { display: none; }
  .stock.pinned-card { border-color: var(--accent); background: var(--pinned-bg); }
  .stock.dragging { box-shadow: 0 10px 28px rgba(0,0,0,0.4); opacity: 0.97; }
  .drag-placeholder {
    height: 0; margin-bottom: 8px; border: 2px dashed var(--accent); border-radius: 12px;
    box-sizing: border-box; opacity: 0.5;
  }
  .pinned-row {
    display: flex; align-items: center; justify-content: space-between;
    background: var(--btn-bg); border: 1px solid var(--card-border); border-radius: 9px;
    padding: 9px 10px; margin-bottom: 8px;
  }
  .pinned-sym { font-weight: 700; font-size: 14px; }
  .pinned-actions { display: flex; gap: 6px; }
  .pinned-actions .toolbar-btn { padding: 5px 10px; font-size: 13px; }
  .pinned-actions .toolbar-btn:disabled { opacity: 0.3; }
  .sub { color: var(--dim); font-size: 12.5px; margin-top: 3px; }
  main { padding: 12px 12px 40px; max-width: 640px; margin: 0 auto; }
  .stock {
    background: var(--card); border: 1px solid var(--card-border); border-radius: 12px;
    margin-bottom: 8px; overflow: hidden;
  }
  .stock-head {
    display: flex; align-items: center; justify-content: space-between;
    padding: 12px 14px; gap: 10px;
  }
  .sym-block { display: flex; flex-direction: column; gap: 1px; flex: 1; min-width: 0; cursor: pointer; }
  .sym { font-weight: 700; font-size: 14.5px; letter-spacing: 0.3px; }
  .company-name { font-size: 10.5px; color: var(--dim); margin-top: 1px; }
  .range { font-family: var(--mono); font-size: 11px; color: var(--dim); }
  .placeholder-text { font-size: 11.5px; color: var(--dim); }
  .price-block { text-align: right; cursor: pointer; }
  .now-price { font-family: var(--mono); font-weight: 700; font-size: 16px; }
  .change { font-family: var(--mono); font-size: 12px; }
  .change.up { color: var(--accent); }
  .change.down { color: var(--down); }
  .change.flat { color: var(--dim); }
  .load-btn {
    flex-shrink: 0; background: var(--btn-bg); border: 1px solid var(--card-border); color: var(--text);
    border-radius: 9px; padding: 8px 14px; font-size: 13px; cursor: pointer;
  }
  .load-btn:active { opacity: 0.7; }
  .load-btn.reload {
    width: 34px; height: 34px; padding: 0; display: flex; align-items: center; justify-content: center;
    color: var(--dim);
  }
  .load-btn.loading { color: var(--accent); }
  .stock-detail {
    display: none; padding: 0 14px 14px; font-family: var(--mono); font-size: 12px;
    color: var(--dim); line-height: 1.65; border-top: 1px solid var(--card-border);
  }
  .stock-detail.open { display: block; }
  .detail-section { margin-top: 10px; }
  .detail-label { color: var(--text); font-weight: 700; font-family: -apple-system, sans-serif; font-size: 11.5px; margin-bottom: 3px; }
  .err-text { color: var(--down); font-size: 11.5px; }

  .overlay {
    display: none; position: fixed; inset: 0; z-index: 50;
    background: rgba(0,0,0,0.55); align-items: flex-end; justify-content: center;
  }
  .overlay.open { display: flex; }
  .settings-card {
    position: relative; width: 100%; max-width: 640px;
    background: var(--card); border-top: 1px solid var(--card-border);
    border-radius: 16px 16px 0 0; padding: 18px 18px 24px;
  }
  .settings-title { font-size: 16px; font-weight: 700; margin-bottom: 14px; }
  .settings-row { margin-bottom: 14px; }
  .settings-row label { display: block; font-size: 12.5px; color: var(--dim); margin-bottom: 6px; }
  .settings-row select, .settings-row input {
    width: 100%; background: var(--btn-bg); border: 1px solid var(--card-border); color: var(--text);
    border-radius: 9px; padding: 9px 10px; font-size: 14px;
  }
  .settings-row input { margin-top: 8px; }
  .settings-actions { display: flex; gap: 10px; margin-top: 6px; }
  .primary-btn, .secondary-btn {
    flex: 1; border-radius: 9px; padding: 11px; font-size: 14px; text-align: center; cursor: pointer; border: 1px solid var(--card-border);
  }
  .primary-btn { background: var(--accent); color: #0a1510; font-weight: 700; border: none; }
  .secondary-btn { background: var(--btn-bg); color: var(--text); }
  .close-btn {
    position: absolute; top: 14px; right: 14px; background: none; border: none; color: var(--dim); font-size: 16px; cursor: pointer;
  }
  .history-nav { display: flex; gap: 8px; align-items: center; margin-bottom: 12px; }
  .history-nav input[type="date"] {
    flex: 1; background: var(--btn-bg); border: 1px solid var(--card-border); color: var(--text);
    border-radius: 9px; padding: 9px 10px; font-size: 14px;
  }
  .history-list { max-height: 58vh; overflow-y: auto; touch-action: pan-y; }
  .trend-scroll { overflow-x: auto; padding: 4px 0; }
  .trend-scroll svg { display: block; }
  .trend-table { max-height: 40vh; overflow-y: auto; margin-top: 10px; font-size: 11.5px; }
  .trend-row {
    display: grid; grid-template-columns: 1.1fr 1fr 1fr 1fr 0.9fr 1.3fr;
    gap: 4px; padding: 6px 2px; border-bottom: 1px solid var(--card-border); text-align: center;
  }
  .trend-row-head { color: var(--dim); font-weight: 700; border-bottom: 1px solid var(--card-border); }
  .trend-legend { display: flex; align-items: center; gap: 12px; margin-bottom: 8px; font-size: 12px; color: var(--dim); flex-wrap: wrap; }
  .trend-legend .dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 4px; }
  .trend-legend select { background: var(--btn-bg); border: 1px solid var(--card-border); color: var(--text); border-radius: 8px; padding: 5px 8px; font-size: 12px; }
</style>
</head>
<body>

<script src="cordova.js"></script>
<script>
  const SYMBOLS = [
    "AIRLINK", "ATRL", "CPHL", "DGKC", "EFERT", "ENGROH", "FCCL", "FFC", "FFL",
    "GAL", "GHNI", "HCAR", "HUBC", "LUCK", "MARI", "MEBL", "MLCF", "NML", "NRL",
    "OGDC", "PAEL", "PPL", "PRL", "PSO", "SAZEW", "SEARL", "SNGP", "SSGC", "SYS", "TREET"
  ];

  const SYMBOL_NAMES = {
    AIRLINK: "Air Link Communication Ltd.",
    ATRL: "Attock Refinery Ltd.",
    CPHL: "Citi Pharma Ltd.",
    DGKC: "D.G. Khan Cement Co. Ltd.",
    EFERT: "Engro Fertilizers Ltd.",
    ENGROH: "Engro Holdings Ltd.",
    FCCL: "Fauji Cement Co. Ltd.",
    FFC: "Fauji Fertilizer Co. Ltd.",
    FFL: "Fauji Foods Ltd.",
    GAL: "Ghandhara Automobiles Ltd.",
    GHNI: "Ghandhara Industries Ltd.",
    HCAR: "Honda Atlas Cars (Pakistan) Ltd.",
    HUBC: "Hub Power Co. Ltd.",
    LUCK: "Lucky Cement Ltd.",
    MARI: "Mari Energies Ltd.",
    MEBL: "Meezan Bank Ltd.",
    MLCF: "Maple Leaf Cement Factory Ltd.",
    NML: "Nishat Mills Ltd.",
    NRL: "National Refinery Ltd.",
    OGDC: "Oil & Gas Development Co. Ltd.",
    PAEL: "Pak Elektron Ltd.",
    PPL: "Pakistan Petroleum Ltd.",
    PRL: "Pakistan Refinery Ltd.",
    PSO: "Pakistan State Oil Co. Ltd.",
    SAZEW: "Sazgar Engineering Works Ltd.",
    SEARL: "The Searle Company Ltd.",
    SNGP: "Sui Northern Gas Pipelines Ltd.",
    SSGC: "Sui Southern Gas Co. Ltd.",
    SYS: "Systems Ltd.",
    TREET: "Treet Corporation Ltd."
  };

  const listEl = document.getElementById("list");

  function fmtTime(ts) {
    return new Date(ts * 1000).toLocaleTimeString("en-PK", {
      hour: "2-digit", minute: "2-digit", second: "2-digit", timeZone: "Asia/Karachi"
    });
  }
  function fmtEntry(entry) {
    return "Rs" + entry[1].toFixed(2) + " - " + fmtTime(entry[0]) + " - V-" + String(entry[2]).padStart(4, "0");
  }

  function isValidPayload(json) {
    return !!(json && json.data && Array.isArray(json.data) && json.data.length > 0);
  }

  // Native HTTP call via cordova-plugin-advanced-http. This runs outside the
  // WebView at the OS/network layer, so the browser's CORS rule never applies
  // — no proxy needed, direct call to PSX every time.
  function nativeGet(url, timeoutSeconds) {
    return new Promise((resolve, reject) => {
      const http = cordova.plugin.http;
      http.setRequestTimeout(timeoutSeconds);
      http.get(
        url,
        {},
        {},
        (response) => {
          try {
            resolve(JSON.parse(response.data));
          } catch (e) {
            reject(e);
          }
        },
        (response) => reject(new Error("HTTP " + (response && response.status) + ": " + (response && response.error ? String(response.error).slice(0, 200) : "no body")))
      );
    });
  }

  async function fetchSymbol(symbol) {
    const target = "https://dps.psx.com.pk/timeseries/int/" + symbol;
    // MEBL and other high-volume stocks return a much larger payload, so allow
    // a longer timeout, with one retry.
    for (let attempt = 0; attempt < 2; attempt++) {
      try {
        const json = await nativeGet(target, 20);
        if (isValidPayload(json)) return json;
        throw new Error("empty payload");
      } catch (e) {
        if (attempt === 0) await new Promise(r => setTimeout(r, 700));
        else throw e;
      }
    }
  }

  // ---------- 25-day EOD trend (separate PSX endpoint, daily candles) ----------
  async function fetchEodData(symbol) {
    const target = "https://dps.psx.com.pk/timeseries/eod/" + symbol;
    let lastJson = null;
    for (let attempt = 0; attempt < 2; attempt++) {
      try {
        const json = await nativeGet(target, 20);
        lastJson = json;
        if (json && Array.isArray(json.data) && json.data.length > 0) return json.data;
        throw new Error("Unexpected response shape: " + JSON.stringify(json).slice(0, 200));
      } catch (e) {
        if (attempt === 0) await new Promise(r => setTimeout(r, 700));
        else throw e;
      }
    }
  }

  // Confirmed from a real device response: [timestamp, close, volume, open].
  // No high/low field exists on this endpoint — only open/close/volume per day.
  function normalizeEodRows(rawRows, daysWanted) {
    const rows = rawRows.slice(0, daysWanted).map(r => ({
      date: new Date(r[0] * 1000),
      close: r[1], volume: r[2], open: r[3]
    }));
    rows.reverse(); // oldest first, so the chart reads left-to-right
    for (let i = 0; i < rows.length; i++) {
      const prevClose = i > 0 ? rows[i - 1].close : rows[i].open;
      rows[i].change = rows[i].close - prevClose;
      rows[i].pctChange = prevClose !== 0 ? (rows[i].change / prevClose) * 100 : 0;
    }
    return rows;
  }

  function eodRawCacheKey(symbol) {
    return "kmi30_eodraw_" + symbol + "_" + todayKey();
  }

  async function getEodRawRows(symbol) {
    try {
      const cached = localStorage.getItem(eodRawCacheKey(symbol));
      if (cached) return JSON.parse(cached);
    } catch (e) {}
    const raw = await fetchEodData(symbol);
    try { localStorage.setItem(eodRawCacheKey(symbol), JSON.stringify(raw)); } catch (e) {}
    return raw;
  }

  function buildTrendSvg(rows) {
    const stepX = 42, padTop = 30, padBottom = 22, padSide = 20;
    const width = padSide * 2 + (rows.length - 1) * stepX;
    const height = 200;
    const plotTop = padTop, plotBottom = height - padBottom;
    const plotHeight = plotBottom - plotTop;

    const allVals = rows.flatMap(r => [r.close, r.open]);
    const minP = Math.min(...allVals), maxP = Math.max(...allVals);
    const rangeP = (maxP - minP) || 1;
    function yFor(val) { return plotTop + (1 - (val - minP) / rangeP) * plotHeight; }

    const closePoints = rows.map((r, i) => ({ x: padSide + i * stepX, y: yFor(r.close), val: r.close }));
    const openPoints = rows.map((r, i) => ({ x: padSide + i * stepX, y: yFor(r.open), val: r.open }));

    function pathFor(points) {
      return points.map((p, i) => (i === 0 ? "M" : "L") + p.x.toFixed(1) + "," + p.y.toFixed(1)).join(" ");
    }

    // A few faint reference gridlines so it's easier to judge where a price sits
    const gridCount = 4;
    let gridLines = "";
    for (let g = 0; g <= gridCount; g++) {
      const gy = plotTop + (plotHeight / gridCount) * g;
      gridLines += `<line x1="${padSide}" y1="${gy.toFixed(1)}" x2="${(width - padSide).toFixed(1)}" y2="${gy.toFixed(1)}" stroke="var(--card-border)" stroke-width="1" stroke-dasharray="2,3" />`;
    }

    // Labels default to one side (close = above, open = below) so the two
    // series don't usually collide; flip to the other side only when that
    // would clip past the chart's own edge — this is what keeps every price
    // fully readable instead of getting cut off.
    function labelsFor(points, colorVar, defaultBelow) {
      return points.map((p) => {
        let labelY;
        if (defaultBelow) {
          const belowY = p.y + 15;
          labelY = (belowY > plotBottom + padBottom - 4) ? p.y - 9 : belowY;
        } else {
          const aboveY = p.y - 9;
          labelY = (aboveY < plotTop - 4) ? p.y + 15 : aboveY;
        }
        return `
          <circle cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="3.2" fill="${colorVar}" />
          <text x="${p.x.toFixed(1)}" y="${labelY.toFixed(1)}" font-size="9" fill="${colorVar}" text-anchor="middle">${p.val.toFixed(1)}</text>
        `;
      }).join("");
    }

    const dayLabels = rows.map((r, i) => {
      const x = padSide + i * stepX;
      return `<text x="${x.toFixed(1)}" y="${height - 6}" font-size="9" fill="var(--dim)" text-anchor="middle">${i + 1}</text>`;
    }).join("");

    return `<svg viewBox="0 0 ${width} ${height}" width="${width}" height="${height}">
      ${gridLines}
      <path d="${pathFor(closePoints)}" fill="none" stroke="var(--accent)" stroke-width="2" />
      <path d="${pathFor(openPoints)}" fill="none" stroke="var(--accent2)" stroke-width="2" stroke-dasharray="4,3" />
      ${labelsFor(closePoints, "var(--accent)", false)}
      ${labelsFor(openPoints, "var(--accent2)", true)}
      ${dayLabels}
    </svg>`;

  function processStock(symbol, data) {
    if (!data || !data.data || data.data.length === 0) return null;
    const ticks = data.data;
    const allPrices = ticks.map(t => t[1]);
    const low = Math.min(...allPrices);
    const high = Math.max(...allPrices);
    const current = ticks[0];
    const openEntry = ticks[ticks.length - 1];
    const closeEntry = ticks[0];
    const change = current[1] - openEntry[1];
    const pctChange = openEntry[1] !== 0 ? (change / openEntry[1]) * 100 : 0;

    let minEntry = ticks[0], maxEntry = ticks[0];
    for (let i = 1; i < ticks.length; i++) {
      if (ticks[i][1] < minEntry[1]) minEntry = ticks[i];
      if (ticks[i][1] > maxEntry[1]) maxEntry = ticks[i];
    }
    const nonZeroVol = ticks.filter(t => t[2] > 0);
    let minVolEntry = nonZeroVol.length ? nonZeroVol[0] : ticks[0];
    let maxVolEntry = ticks[0];
    for (const t of nonZeroVol) if (t[2] < minVolEntry[2]) minVolEntry = t;
    for (const t of ticks) if (t[2] > maxVolEntry[2]) maxVolEntry = t;

    const filtered = [];
    for (let i = 0; i < ticks.length; i++) {
      const nextPrice = ticks[i + 1] ? ticks[i + 1][1] : null;
      if (nextPrice === null || ticks[i][1] !== nextPrice) filtered.push(ticks[i]);
    }
    const recentTicks = filtered.slice(0, 6);

    // Each tick's volume field is that individual trade's own size — not a
    // running cumulative total — so today's total shares traded is the sum
    // of every tick's volume, not just the latest one.
    const totalVolume = ticks.reduce((sum, t) => sum + t[2], 0);

    return { symbol, low, high, current, openEntry, closeEntry, change, pctChange, minEntry, maxEntry, minVolEntry, maxVolEntry, recentTicks, totalVolume };
  }

  async function loadOne(symbol) {
    const card = document.querySelector(`.stock[data-symbol="${symbol}"]`);
    const btn = card.querySelector("[data-load]");
    if (btn) {
      btn.classList.add("loading");
      btn.textContent = btn.classList.contains("reload") ? "…" : "Loading…";
      btn.disabled = true;
    }

    try {
      const data = await fetchSymbol(symbol);
      const s = processStock(symbol, data);
      if (!s) throw new Error("no data");
      lastStockData[symbol] = s;
      card.innerHTML = loadedCardInner(s);

    }

  // ---------- Sorting ----------
  function sortValue(symbol, mode) {
    const s = lastStockData[symbol];
    if (!s) return null;
    switch (mode) {
      case "price-desc": return -s.current[1];
      case "price-asc": return s.current[1];
      case "change-desc": return -s.pctChange;
      case "change-asc": return s.pctChange;
      case "volume-desc": return -s.totalVolume;
      case "volume-asc": return s.totalVolume;
      default: return null;
    }
  }

  function applySort() {
    const mode = document.getElementById("sortSelect").value;
    const cards = Array.from(listEl.children);
    cards.sort((a, b) => {
      const aSym = a.dataset.symbol, bSym = b.dataset.symbol;
      const aPin = pinnedOrder.indexOf(aSym), bPin = pinnedOrder.indexOf(bSym);
      if (aPin !== -1 || bPin !== -1) {
        if (aPin === -1) return 1;
        if (bPin === -1) return -1;
        return aPin - bPin;
      }
      if (mode === "symbol") return aSym.localeCompare(bSym);
      const va = sortValue(aSym, mode);
      const vb = sortValue(bSym, mode);
      if (va === null && vb === null) return 0;
      if (va === null) return 1;
      if (vb === null) return -1;
      return va - vb;
    });
    cards.forEach(c => listEl.appendChild(c));
  }

      if (up) {

        const i = parseInt(down.getAttribute("data-pin-down"), 10);
        [pinnedOrder[i + 1], pinnedOrder[i]] = [pinnedOrder[i], pinnedOrder[i + 1]];
        savePinned(); renderPinnedList(); applySort();
      } else if (remove) {
        const sym = remove.getAttribute("data-pin-remove");
        pinnedOrder = pinnedOrder.filter(s => s !== sym);
        savePinned(); renderPinnedList(); applySort(); updatePinButtons();

  function loadSettings() {
    try {
      const raw = localStorage.getItem("kmi30_settings");
      if (raw) return Object.assign({}, DEFAULT_SETTINGS, JSON.parse(raw));
    } catch (e) {}
    return Object.assign({}, DEFAULT_SETTINGS);
  }
  function saveSettingsToStorage(s) {
    try { localStorage.setItem("kmi30_settings", JSON.stringify(s)); } catch (e) {}
  }
  let settings = loadSettings();
  let lastAutoRefreshAt = 0;

  function updateSubLine(text) {

  function isWeekendKarachi() {
    const weekday = new Date().toLocaleString("en-US", { timeZone: "Asia/Karachi", weekday: "short" });
    return weekday === "Sat" || weekday === "Sun";
  }

  function isMarketOpenNow() {
    if (isWeekendKarachi()) return false;
    const hourStr = new Date().toLocaleString("en-US", { hour: "2-digit", hour12: false, timeZone: "Asia/Karachi" });
    const hour = parseInt(hourStr, 10) % 24;
    return hour >= settings.startHour && hour < settings.endHour;
  }

  async function loadAllParallel() {
    await Promise.all(SYMBOLS.map(symbol => loadOne(symbol)));
  }

  function todayKey() {
    return new Date().toLocaleDateString("en-CA", { timeZone: "Asia/Karachi" }); // YYYY-MM-DD
  }

  function buildCsv(dateStr) {
    const header = "Date,Symbol,Open,Close,Low,High,TotalVolume,MinVolume,MaxVolume,Change,PctChange\n";
    const rows = SYMBOLS.map(sym => {
      const s = lastStockData[sym];
      if (!s) return [dateStr, sym, "", "", "", "", "", "", "", "", ""].join(",");
      return [
        dateStr, sym,
        s.openEntry[1].toFixed(2),
        s.closeEntry[1].toFixed(2),
        s.low.toFixed(2),
        s.high.toFixed(2),
        s.totalVolume,
        s.minVolEntry[2],
        s.maxVolEntry[2],
        s.change.toFixed(2),
        s.pctChange.toFixed(2)
      ].join(",");
    });
    return header + rows.join("\n") + "\n";
  }

  function writeCsvToRecordFile(dateStr, csvText) {
    return new Promise((resolve, reject) => {
      window.resolveLocalFileSystemURL(cordova.file.externalDataDirectory, (dir) => {
        dir.getDirectory("KMI30-Records", { create: true }, (recordsDir) => {
          recordsDir.getFile("KMI30_" + dateStr + ".csv", { create: true }, (fileEntry) => {
            fileEntry.createWriter((writer) => {
              writer.onwriteend = () => resolve();
              writer.onerror = reject;
              writer.write(csvText);
            }, reject);
          }, reject);
        }, reject);
      }, reject);
    });
  }

  function exportDailyRecord(dateStr) {
    return writeCsvToRecordFile(dateStr, buildCsv(dateStr));
  }

  function maybeExportEndOfDay() {
    if (isWeekendKarachi()) return;
    const hourStr = new Date().toLocaleString("en-US", { hour: "2-digit", hour12: false, timeZone: "Asia/Karachi" });
    const hour = parseInt(hourStr, 10) % 24;
    if (hour < settings.endHour) return;
    const today = todayKey();
    if (localStorage.getItem("kmi30_last_export") === today) return;
    exportDailyRecord(today).then(() => {
      localStorage.setItem("kmi30_last_export", today);
    }).catch(() => {});
  }

  // ---------- History (previous days' records) ----------
  let historyDate = null;

  function parseCsv(text) {
    const lines = text.trim().split("\n");
    if (lines.length < 2) return [];
    const header = lines[0].split(",");
    return lines.slice(1).map(line => {
      const cols = line.split(",");
      const obj = {};
      header.forEach((h, i) => obj[h] = cols[i]);
      return obj;
    }).filter(r => r.Open); // skip symbols that had no data that day
  }

  function readDailyRecord(dateStr) {
    return new Promise((resolve, reject) => {
      const path = cordova.file.externalDataDirectory + "KMI30-Records/KMI30_" + dateStr + ".csv";
      window.resolveLocalFileSystemURL(path, (fileEntry) => {
        fileEntry.file((file) => {
          const reader = new FileReader();
          reader.onloadend = () => resolve(parseCsv(reader.result));
          reader.onerror = reject;
          reader.readAsText(file);
        }, reject);
      }, reject);
    });
  }

  function historyRowHtml(rec) {
    const changeNum = parseFloat(rec.Change);
    const dir = changeNum > 0.001 ? "up" : changeNum < -0.001 ? "down" : "flat";

  function loadHistoryDate(dateStr) {

  function shiftHistoryDate(deltaDays) {

    loadHistoryDate(d.toISOString().slice(0, 10));

  function shareRecord(dateStr) {
    const path = cordova.file.externalDataDirectory + "KMI30-Records/KMI30_" + dateStr + ".csv";
    if (window.plugins && window.plugins.socialsharing) {
      window.plugins.socialsharing.shareWithOptions({
        message: "KMI-30 record - " + dateStr,
        files: [path]
      }, () => {}, () => alert("Share nahi ho saka — is din ki file mojood nahi"));
    } else {
      alert("Share feature available nahi hai");

  function wireImport() {
    const fileInput = document.getElementById("importFileInput");
    document.getElementById("importRecordBtn").addEventListener("click", () => fileInput.click());
    fileInput.addEventListener("change", (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = () => {
        writeCsvToRecordFile(historyDate, reader.result).then(() => {
          loadHistoryDate(historyDate);
          alert(historyDate + " ka record import ho gaya");
        }).catch(() => alert("Import nahi ho saka"));
      };
      reader.onerror = () => alert("File padhi nahi ja saki");

  function wireHistorySwipe() {
    const el = document.getElementById("historyList");
    let startX = 0;
    el.addEventListener("touchstart", (e) => { startX = e.touches[0].clientX; }, { passive: true });
    el.addEventListener("touchend", (e) => {
      const deltaX = e.changedTouches[0].clientX - startX;
      if (Math.abs(deltaX) < 50) return;
      if (deltaX < 0) shiftHistoryDate(1);   // swipe left -> next day
      else shiftHistoryDate(-1);             // swipe right -> previous day
    }, { passive: true });
  }

  function wireHistoryPanel() {
    const overlay = document.getElementById("historyOverlay");
    document.getElementById("historyBtn").addEventListener("click", () => {
      overlay.classList.add("open");

    document.getElementById("closeHistoryBtn").addEventListener("click", () => overlay.classList.remove("open"));
    document.getElementById("historyDateInput").addEventListener("change", (e) => loadHistoryDate(e.target.value));
    document.getElementById("prevDayBtn").addEventListener("click", () => shiftHistoryDate(-1));
    document.getElementById("nextDayBtn").addEventListener("click", () => shiftHistoryDate(1));
    document.getElementById("shareRecordBtn").addEventListener("click", () => shareRecord(historyDate));
    wireImport();
    wireHistorySwipe();
  }

  function heartbeat() {
    if (isMarketOpenNow()) {
      const intervalMs = settings.intervalMinutes * 60000;
      if (Date.now() - lastAutoRefreshAt >= intervalMs) {
        lastAutoRefreshAt = Date.now();
        loadAllParallel();
      }
      updateSubLine(`Auto-update har ${settings.intervalMinutes} minute — market open hai (${settings.startHour}:00–${settings.endHour}:00)`);
    } else if (isWeekendKarachi()) {
      updateSubLine("Market band hai — Saturday/Sunday ko auto-update nahi hota");
    } else {
      updateSubLine(`Market band hai — auto-update sirf ${settings.startHour}:00–${settings.endHour}:00 ke doran hota hai`);
    }
    maybeExportEndOfDay();
  }

  function populateHourSelects() {
    const startSel = document.getElementById("startHourSelect");
    const endSel = document.getElementById("endHourSelect");
    let opts = "";
    for (let h = 0; h < 24; h++) {
      const label = String(h).padStart(2, "0") + ":00";
      opts += `<option value="${h}">${label}</option>`;
    }
    startSel.innerHTML = opts;
    endSel.innerHTML = opts;
    startSel.value = settings.startHour;
    endSel.value = settings.endHour;
  }

  function populateIntervalSelect() {
    const sel = document.getElementById("intervalSelect");
    const customInput = document.getElementById("customInterval");
    const presets = [1, 2, 3, 4, 5, 10, 15, 30];
    if (presets.includes(settings.intervalMinutes)) {
      sel.value = String(settings.intervalMinutes);
      customInput.style.display = "none";
    } else {
      sel.value = "custom";
      customInput.style.display = "block";
      customInput.value = settings.intervalMinutes;
    }
  }

  function applyTheme() {
    document.body.classList.toggle("light-theme", settings.theme === "light");
    document.getElementById("themeSelect").value = settings.theme;
  }

  function wireSettingsPanel() {
    const overlay = document.getElementById("settingsOverlay");
    document.getElementById("settingsBtn").addEventListener("click", () => overlay.classList.add("open"));
    document.getElementById("closeSettingsBtn").addEventListener("click", () => overlay.classList.remove("open"));
    document.getElementById("intervalSelect").addEventListener("change", (e) => {
      document.getElementById("customInterval").style.display = e.target.value === "custom" ? "block" : "none";
    });
    document.getElementById("saveSettingsBtn").addEventListener("click", () => {
      const sel = document.getElementById("intervalSelect");
      let mins;
      if (sel.value === "custom") {
        mins = parseInt(document.getElementById("customInterval").value, 10);
        if (!mins || mins < 1) mins = 1;
      } else {
        mins = parseInt(sel.value, 10);
      }
      settings.intervalMinutes = mins;
      settings.startHour = parseInt(document.getElementById("startHourSelect").value, 10);
      settings.endHour = parseInt(document.getElementById("endHourSelect").value, 10);
      settings.theme = document.getElementById("themeSelect").value;
      saveSettingsToStorage(settings);
      applyTheme();
      lastAutoRefreshAt = 0; // apply new interval right away
      overlay.classList.remove("open");
      heartbeat();
    });
    document.getElementById("exportNowBtn").addEventListener("click", () => {
      exportDailyRecord(todayKey())
        .then(() => alert("Record save ho gaya:\nAndroid/data/com.mushtaq.kmi30live/files/KMI30-Records/"))
        .catch(() => alert("Save nahi hua — dobara try karein"));
    });
  }

  function attachCardListeners(card) {
    const loadBtn = card.querySelector("[data-load]");
    if (loadBtn) loadBtn.addEventListener("click", () => loadOne(loadBtn.getAttribute("data-load")));
    card.querySelectorAll("[data-toggle]").forEach(el => {
      el.addEventListener("click", () => {
        const sym = el.getAttribute("data-toggle");
        document.getElementById("detail-" + sym).classList.toggle("open");
      });
    });
    const trendBtn = card.querySelector("[data-trend]");
    if (trendBtn) trendBtn.addEventListener("click", (e) => {
      e.stopPropagation();
      openTrendFor(trendBtn.getAttribute("data-trend"));
    });
    applyPinIndicator(card);
    if (!card.dataset.longpressBound) {
      card.dataset.longpressBound = "1";
      attachLongPress(card);
    }
  }

  // Long-press anywhere on a card (except its buttons) pins it straight to
  // the top of the list. Long-press it again to unpin. No submenu needed.
  // Long-press (hold ~450ms without moving) picks a card up so you can drag
  // it up/down with your finger to the exact spot you want. Releasing drops
  // it there — no jumping to top automatically, no submenu needed.
  // Long-press (hold ~450ms without moving) picks a card up — it detaches
  // from the list and follows your finger exactly, while a placeholder
  // marks its slot. Move the placeholder past other pinned cards to swap;
  // release to drop the card into that slot. The real card element is
  // never moved in the DOM mid-drag (only the placeholder is), so touch
  // tracking never breaks partway through a drag.
  function attachLongPress(card) {
    const symbol = card.dataset.symbol;
    let timer = null;
    let dragging = false;
    let suppressClick = false;
    let startX = 0, startY = 0;
    let placeholder = null;
    let cardWidth = 0, cardHeight = 0, cardLeft = 0;
    let grabOffsetY = 0;

    function onTouchStart(e) {
      if (e.target.closest("button")) return;
      if (e.touches.length !== 1) return;
      suppressClick = false;
      dragging = false;
      const t = e.touches[0];
      startX = t.clientX; startY = t.clientY;
      timer = setTimeout(() => {
        dragging = true;
        suppressClick = true;
        if (navigator.vibrate) navigator.vibrate(20);

        if (!pinnedOrder.includes(symbol)) {
          pinnedOrder.push(symbol);
          savePinned();
          applySort();
          updatePinButtons();
        }

        const rect = card.getBoundingClientRect();
        cardWidth = rect.width; cardHeight = rect.height; cardLeft = rect.left;
        grabOffsetY = startY - rect.top;

        placeholder = document.createElement("div");
        placeholder.className = "drag-placeholder";
        placeholder.style.height = cardHeight + "px";
        card.parentNode.insertBefore(placeholder, card);

        card.classList.add("dragging");
        card.style.position = "fixed";
        card.style.left = cardLeft + "px";
        card.style.top = rect.top + "px";
        card.style.width = cardWidth + "px";
        card.style.zIndex = "999";
        card.style.pointerEvents = "none";
      }, 450);
    }

    function onTouchMove(e) {
      if (!dragging) {
        if (!timer) return;
        const t = e.touches[0];
        if (Math.abs(t.clientX - startX) > 10 || Math.abs(t.clientY - startY) > 10) {
          clearTimeout(timer);
          timer = null;
        }
        return;
      }
      e.preventDefault();
      const t = e.touches[0];
      const newTop = t.clientY - grabOffsetY;
      card.style.top = newTop + "px";

      const dragMid = newTop + cardHeight / 2;
      const siblings = Array.from(listEl.querySelectorAll(".stock.pinned-card")).filter(el => el !== card);
      const children = Array.from(listEl.children);
      const placeholderIndex = children.indexOf(placeholder);
      for (const sib of siblings) {
        const sibRect = sib.getBoundingClientRect();
        const sibMid = sibRect.top + sibRect.height / 2;
        const sibIndex = children.indexOf(sib);
        if (placeholderIndex > sibIndex && dragMid < sibMid) {
          listEl.insertBefore(placeholder, sib);
          break;
        } else if (placeholderIndex < sibIndex && dragMid > sibMid) {
          listEl.insertBefore(placeholder, sib.nextSibling);
          break;
        }
      }
    }

    function endTouch() {
      if (timer) { clearTimeout(timer); timer = null; }
      if (dragging) {
        dragging = false;
        if (placeholder && placeholder.parentNode) {
          placeholder.parentNode.insertBefore(card, placeholder);
          placeholder.parentNode.removeChild(placeholder);
        }
        placeholder = null;
        card.classList.remove("dragging");
        card.style.position = "";
        card.style.left = "";
        card.style.top = "";
        card.style.width = "";
        card.style.zIndex = "";
        card.style.pointerEvents = "";

        pinnedOrder = Array.from(listEl.querySelectorAll(".stock.pinned-card")).map(el => el.dataset.symbol);
        savePinned();
        updatePinButtons();
        renderPinnedList();
      }
    }

    card.addEventListener("touchstart", onTouchStart, { passive: true });
    card.addEventListener("touchmove", onTouchMove, { passive: false });
    card.addEventListener("touchend", endTouch, { passive: true });
    card.addEventListener("touchcancel", endTouch, { passive: true });

    // Suppress the expand/collapse click that would otherwise also fire
    // right after a drag ends on release.
    card.addEventListener("click", (e) => {
      if (suppressClick) {
        e.stopPropagation();
        suppressClick = false;
      }
    }, true);
  }

  function init() {
    listEl.innerHTML = SYMBOLS.map(emptyCardHtml).join("");
    document.querySelectorAll(".stock").forEach(attachCardListeners);
    populateHourSelects();
    populateIntervalSelect();
    applyTheme();
    wireSettingsPanel();
    wireToolbar();
    wireHistoryPanel();
    wireTrendPanel();
    wirePinnedPanel();
    updatePinButtons();
    applySort();
    loadAllParallel();
    heartbeat();
    setInterval(heartbeat, 20000);
  }

  // In a real APK, Cordova fires "deviceready" once native plugins are ready.
  // In a plain browser (no Cordova runtime), that event never comes — so we
  // fall back to normal page-load, purely so the UI (settings, sort, theme,
  // expand/collapse) can still be tested. Live data fetch still needs the
  // actual APK, since it depends on the native HTTP plugin.
  if (window.cordova) {
    document.addEventListener("deviceready", init, false);
  } else {
    document.addEventListener("DOMContentLoaded", init);
  }
</script>
