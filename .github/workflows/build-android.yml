name: Build Android APK

on:
  push:
    branches: [ main ]
    paths:
      - 'version.txt'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Check version increased
        id: checkversion
        run: NEW_VERSION=$(cat version.txt | tr -d '[:space:]'); OLD_VERSION=$(git show HEAD~1:version.txt 2>/dev/null | tr -d '[:space:]' || echo 0); echo "Old=$OLD_VERSION New=$NEW_VERSION"; IS_MANUAL="${{ github.event_name != 'push' }}"; if [ "$IS_MANUAL" = "true" ] || [ "$NEW_VERSION" -gt "$OLD_VERSION" ] 2>/dev/null; then echo "should_build=true" >> "$GITHUB_OUTPUT"; else echo "should_build=false" >> "$GITHUB_OUTPUT"; fi; echo "version=$NEW_VERSION" >> "$GITHUB_OUTPUT"

      - name: Stamp version into app
        if: steps.checkversion.outputs.should_build == 'true'
        run: VERSION=$(cat version.txt | tr -d '[:space:]'); sed -i "s/__VERSION__/$VERSION/g" www/index.html; echo "Stamped version $VERSION into www/index.html"

      - name: Set up Node.js
        if: steps.checkversion.outputs.should_build == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Java
        if: steps.checkversion.outputs.should_build == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        if: steps.checkversion.outputs.should_build == 'true'
        uses: android-actions/setup-android@v3

      - name: Install Cordova
        if: steps.checkversion.outputs.should_build == 'true'
        run: npm install -g cordova

      - name: Add Android platform
        if: steps.checkversion.outputs.should_build == 'true'
        run: test -d platforms/android || cordova platform add android

      - name: Add plugins
        if: steps.checkversion.outputs.should_build == 'true'
        run: (cordova plugin add cordova-plugin-advanced-http || true) && (cordova plugin add cordova-plugin-file || true) && (cordova plugin add cordova-plugin-x-socialsharing || true)

      - name: Build debug APK
        if: steps.checkversion.outputs.should_build == 'true'
        run: cordova build android --debug --buildConfig=build.json

      - name: Rename APK
        if: steps.checkversion.outputs.should_build == 'true'
        run: cp platforms/android/app/build/outputs/apk/debug/app-debug.apk "KMI 30 Live.apk"

      - name: Upload APK (build artifact)
        if: steps.checkversion.outputs.should_build == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: kmi30-live-apk
          path: KMI 30 Live.apk

      - name: Publish APK to a permanent Release link
        if: steps.checkversion.outputs.should_build == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: release
          name: KMI-30 Live APK
          files: KMI 30 Live.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Keep a numbered backup of this version too
        if: steps.checkversion.outputs.should_build == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: backup-v${{ steps.checkversion.outputs.version }}
          name: Backup — Version ${{ steps.checkversion.outputs.version }}
          files: KMI 30 Live.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
